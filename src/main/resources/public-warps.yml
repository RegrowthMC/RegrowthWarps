name: "Player Warps"

gui:
  title: "Player Warps"
  format:
    - "c#######c"
    - "#wwwwwww#"
    - "#wwwwwww#"
    - "#wwwwwww#"
    - "#wwwwwww#"
    - "cs#<r>#qc"
  slots:
    'w':
      icon:
        material: bamboo_door
        display-name: "<#FBC067><b>%warp_display_name%</b>"
        lore:
          - "<#444444>|</#444444> <gray>%warp_description%</gray>"
          - " "
          - "<#FBC067><b>Information:</b>"
          - "  <#FFD392>Location:</#FFD392> <white>%warp_location%</white>"
          - "  <#FFD392>Category:</#FFD392> <white>%warp_category%</white>"
          - "  <#FFD392>Visits:</#FFD392> <white>%warp_visits%</white>"
          - " "
          - "<#FBC067><b>Options:</b></#FBC067>"
          - "<#FFD392>ʟᴇғᴛ ᴄʟɪᴄᴋ</#FFD392> <white>Teleport</white>"
          - "<#FFD392>ʀɪɢʜᴛ ᴄʟɪᴄᴋ</#FFD392> <white>Favourite</white>"
    's':
      icon:
        material: brush
        display-name: "<#FBC067><b>Sorting</b>"
        lore:
          - "<#FFD392>Current:</#FFD392> <white>%sorting_method%</white>"
          - " "
          - "<#FBC067><b>Options:</b></#FBC067>"
          - "<#FFD392>ʟᴇғᴛ ᴄʟɪᴄᴋ</#FFD392> <white>Change sort type</white>"
      action: "sort_method"
    'q':
      icon:
        material: spyglass
        display-name: "<#FBC067><b>Search</b>"
        lore:
          - "<#FFD392>Current:</#FFD392> <white>%search_query%</white>"
          - " "
          - "<#FBC067><b>Options:</b></#FBC067>"
          - "<#FFD392>ʟᴇғᴛ ᴄʟɪᴄᴋ</#FFD392> <white>Search</white>"
      action: "search_warps"
    'r':
      icon:
        material: bamboo_door
        display-name: "<#FBC067><b>Return</b>"
        lore:
          - "<#A7A4A0>Return to the <#FFD392>categories</#FFD392> menu"
      action:
        type: warp_menu
        menu: public_categories
    '#':
      icon:
        material: lime_stained_glass_pane
        display-name: ''
    'c':
      icon:
        material: sunflower
        display-name: ''
    '>':
      icon:
        material: arrow
        display-name: "<#FBC067><b>Next Page</b>"
      fallback: '#'
    '<':
      icon:
        material: arrow
        display-name: "<#FBC067><b>Previous Page</b>"
      fallback: '#'

categories-gui:
  title: "Player Warps"
  format:
    - "c#######c"
    - "###fay###"
    - "##12345##"
    - "c#######c"
  slots:
    'f':
      icon:
        material: pink_petals
        display-name: "<#FBC067><b>Favourite Warps</b></#FBC067> <gray>-</gray> <red><i>Coming soon..."
        lore:
          - "<#A7A4A0>View your <#FFD392>favourite</#FFD392> warps"
    'a':
      icon:
        material: player_head
        skull-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDM0NjdhNTMxOTc4ZDBiOGZkMjRmNTYyODVjNzI3MzRkODRmNWVjODhlMGI0N2M0OTMyMzM2Mjk3OWIzMjNhZiJ9fX0="
        display-name: "<#FBC067><b>All Warps</b>"
        lore:
          - "<#A7A4A0>View all <#FFD392>%total_warps%</#FFD392> warps"
      action:
        type: warp_menu
        menu: public
    'y':
      icon:
        material: player_head
        skull-texture: mirror
        display-name: "<#FBC067><b>Your Warps</b>"
        lore:
          - "<#A7A4A0>Click here to <#FFD392>view</#FFD392>, <#FFD392>edit</#FFD392> and <#FFD392>delete"
          - "<#A7A4A0>your warps"
    '1':
      icon:
